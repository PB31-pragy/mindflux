<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Flux — by Pragy B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-deep:  #0d0015;
      --purple-dark:  #130025;
      --purple-mid:   #3b0070;
      --purple-glow:  #7c3aed;
      --purple-light: #a855f7;
      --pink-glow:    #ec4899;
      --neon:         #c084fc;
      --text:         #ffffff;
      --muted:        rgba(255,255,255,0.5);
      --muted2:       rgba(255,255,255,0.25);
      --glass:        rgba(120,50,200,0.12);
      --glass-border: rgba(168,85,247,0.25);
      --glass-hover:  rgba(120,50,200,0.22);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      color: var(--text);
      overflow-x: hidden;
      background: var(--purple-deep);
    }

    /* ── GALAXY BACKGROUND ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 10%,  #2d0060 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%,  #1a0040 0%, transparent 45%),
        radial-gradient(ellipse at 50% 60%,  #3b0070 0%, transparent 55%),
        radial-gradient(ellipse at 10% 80%,  #1e0045 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%,  #2a005a 0%, transparent 45%),
        #0d0015;
    }

    /* star particles */
    .stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 15% 20%,  rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 8%,   rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 30%,  rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 15%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 40%,  rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  55%,  rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 70%,  rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 85%,  rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 65%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 82% 78%,  rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 45%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 25%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 18% 90%,  rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 77% 52%,  rgba(255,255,255,0.4) 0%, transparent 100%);
    }

    /* floating orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none; z-index: 0;
      animation: orbFloat ease-in-out infinite alternate;
    }
    .orb1 { width:500px;height:500px; background:radial-gradient(circle,rgba(124,58,237,0.5),transparent 70%); top:-100px;left:-100px; animation-duration:8s; }
    .orb2 { width:400px;height:400px; background:radial-gradient(circle,rgba(168,85,247,0.4),transparent 70%); top:20%;right:-80px; animation-duration:10s; animation-delay:2s; }
    .orb3 { width:350px;height:350px; background:radial-gradient(circle,rgba(236,72,153,0.3),transparent 70%); bottom:10%;left:15%; animation-duration:9s; animation-delay:1s; }
    .orb4 { width:280px;height:280px; background:radial-gradient(circle,rgba(192,132,252,0.35),transparent 70%); bottom:25%;right:5%; animation-duration:11s; animation-delay:3s; }

    @keyframes orbFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,40px) scale(1.08); }
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── LAYOUT ── */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 80px;
      overflow: visible;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 0 0;
    }

    .logo {
      font-size: 20px; font-weight: 800;
      letter-spacing: -0.5px; color: #fff;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(168,85,247,0.8);
    }
    .logo .dot { color: var(--neon); }

    .nav-pill {
      background: rgba(120,50,200,0.2);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 12px; font-weight: 500;
      color: var(--neon);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(168,85,247,0.2);
    }

    /* ── HERO ── */
    .hero { padding: 90px 0 70px; }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 12px; font-weight: 500;
      color: var(--neon);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
      box-shadow: 0 0 20px rgba(168,85,247,0.2);
    }
    .hero-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
    }

    /* ── PENDANT LIGHT ── */
    /*
     * The pendant pivot is anchored above the h1 (computed by JS at runtime).
     * All pendant elements are position:fixed so they sit in viewport space,
     * completely independent of the scrollable page layout.
     *
     * Structure:
     *   #pPivot   — fixed point at computed pivot x,y (top of cord)
     *     #pArm   — rotated by JS (transform-origin: 0 0 at pivot)
     *       #pCord  — the visible cord line
     *       #pBulb  — the glowing bulb, placed at arm tip
     *   #pCone  — separate fixed div, tracks bulbX/bulbY each frame
     */

    #pPivot {
      position: absolute;
      /* left/top set by JS relative to hero section */
      width: 0; height: 0;
      pointer-events: none;
      z-index: 20;
    }

    /* pArm rotates around its own origin (0,0) = the pivot point */
    #pArm {
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      transform-origin: 0 0;
      /* JS sets transform: rotate(Xdeg) */
    }

    /* Cord: thin vertical line from arm origin downward */
    #pCord {
      position: absolute;
      top: 0;
      left: -0.75px;
      width: 1.5px;
      background: linear-gradient(
        to bottom,
        rgba(200,180,255,0.0)  0%,
        rgba(200,180,255,0.65) 6%,
        rgba(200,180,255,0.65) 72%,
        rgba(200,180,255,0.0) 100%
      );
    }

    /* Bulb: sits at end of cord, centred on arm axis */
    #pBulb {
      position: absolute;
      /* top set by JS = cordLen - BULB_H (same as cord height) */
      left: -9px; /* half of 18px width, centres on arm axis */
      width: 18px;
      height: 24px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      background: radial-gradient(ellipse at 38% 32%, #fffff0 0%, #fff8cc 45%, #f0c830 100%);
      box-shadow:
        0 0  8px 3px  rgba(255,230,80, 0.7),
        0 0 18px 6px  rgba(255,200,50, 0.3),
        0 0 36px 10px rgba(255,170,0,  0.12);
      animation: pBulbPulse 2.8s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes pBulbPulse {
      0%,100% { box-shadow: 0 0  8px 3px rgba(255,230,80,0.7), 0 0 22px 8px rgba(255,200,50,0.35), 0 0 50px 16px rgba(255,170,0,0.18); }
      50%     { box-shadow: 0 0 12px 5px rgba(255,240,100,0.8), 0 0 30px 12px rgba(255,215,60,0.45), 0 0 65px 22px rgba(255,185,0,0.25); }
    }

    /* Descent animation — only animates #pPivot's translateY */
    @keyframes pDescend {
      from { transform: translate(var(--px), -120px); }
      to   { transform: translate(var(--px), var(--py)); }
    }

    /* Cone: separate fixed element, JS moves left/top to track bulb */
    #pCone {
      position: absolute;
      width: 480px;
      height: 100vh; /* spans full viewport so glow runs from top */
      pointer-events: none;
      z-index: 9;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse 50% 100% at 50% 0%,
        rgba(255,235,140,0.14) 0%,
        rgba(255,225,90, 0.06) 40%,
        transparent 100%
      );
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Ambient glow that stays after pendulum rests */
    #pAmbient {
      position: absolute;
      width: 600px; height: 300px;
      pointer-events: none;
      z-index: 8;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 50% 20%,
        rgba(255,215,70, 0.06) 0%,
        rgba(180,100,255,0.04) 55%,
        transparent 80%
      );
      opacity: 0;
      transition: opacity 1.6s ease;
    }

    /* ── HERO HEADING ── */
    .hero { position: relative; overflow: visible; }

    .hero h1 {
      font-size: clamp(52px, 10vw, 100px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 24px;
      text-transform: uppercase;
      position: relative;   /* stacking context for .h1-hot */
      /* start invisible; JS fades in after measuring position */
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    /* h1 becomes visible when JS adds this class */
    .hero h1.h1-visible { opacity: 1; }

    .hero h1 .line1 {
      display: block;
      color: rgba(255,255,255,0.65);
      text-shadow: 0 0 40px rgba(168,85,247,0.3);
    }
    .hero h1 .line2 {
      display: block;
      background: linear-gradient(135deg, #c084fc, #e879f9, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: brightness(1.15);
      transition: filter 0.35s ease;
    }
    .hero h1 .line2.lit { filter: brightness(0.55); }

    /*
     * .h1-hot: pixel-identical copy of the h1 text, stacked on top.
     * Inherits every font property so there is zero misalignment.
     * clip-path is updated every rAF frame to follow the bulb position.
     * When clip radius = 0, the overlay is fully hidden.
     * When it grows, bright text is revealed exactly where the light falls.
     */
    /*
     * .h1-hot: bright overlay clipped to the light circle.
     *
     * IMPORTANT: -webkit-background-clip:text on a child element breaks
     * the parent's clip-path in Blink/WebKit — the two clip mechanisms
     * conflict and the gradient line renders inverted/dark.
     *
     * Fix: clip-path is applied directly to EACH SPAN individually,
     * not to the parent div. Both spans get the same circle value,
     * set by JS each frame via the two vars --clip-line1 / --clip-line2
     * (actually we just target both children directly in JS).
     *
     * line2 in the hot overlay uses a solid bright color — no
     * background-clip:text — so there is zero stacking conflict.
     */
    /* Single clip on parent = one unified light arc over both lines */
    .h1-hot {
      position: absolute;
      inset: 0;
      font-size:      inherit;
      font-weight:    inherit;
      font-family:    inherit;
      line-height:    inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      pointer-events: none;
      user-select: none;
      margin: 0; padding: 0;
      /* mask instead of clip-path — gives soft feathered edge instead of hard border */
      -webkit-mask-image: radial-gradient(circle at 50% -30px, black 0%, black 30%, transparent 70%);
      mask-image:         radial-gradient(circle at 50% -30px, black 0%, black 30%, transparent 70%);
      -webkit-mask-size: 0px 0px;
      mask-size: 0px 0px;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      /* clip-path removed — mask handles the soft reveal */
    }
    .h1-hot .line1 {
      display: block;
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      text-shadow: 0 0 16px rgba(255,235,130,0.6), 0 0 30px rgba(255,210,80,0.3);
      /* NO clip-path here */
    }
    .h1-hot .line2 {
      display: block;
      /* Solid color only — no background-clip:text — so parent clip-path works */
      color: #6b21a8;
      -webkit-text-fill-color: #6b21a8;
      /* NO clip-path here */
    }

    .hero-sub {
      font-size: 16px; font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 460px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    /* ── STATS — pill ── */
    .hero-stats {
      display: inline-flex;
      align-items: center;
      background: rgba(120,50,200,0.15);
      border: 1px solid rgba(168,85,247,0.3);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.4s forwards;
      box-shadow: 0 0 30px rgba(124,58,237,0.2);
    }

    .stat {
      display: flex; align-items: center;
      gap: 7px; padding: 11px 22px;
      white-space: nowrap;
    }
    .stat + .stat { border-left: 1px solid rgba(168,85,247,0.2); }

    .stat-dot {
      width: 6px; height: 6px;
      border-radius: 50%; flex-shrink: 0;
    }
    .stat-dot.purple { background:#c084fc; box-shadow:0 0 8px #c084fc; }
    .stat-dot.blue   { background:#818cf8; box-shadow:0 0 8px #818cf8; }
    .stat-dot.pink   { background:#f472b6; box-shadow:0 0 8px #f472b6; }

    .stat-num {
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .stat-label {
      font-size: 13px; font-weight: 300; color: var(--muted);
    }

    /* ── SECTION LABEL ── */
    .section-header {
      display: flex; align-items: center;
      gap: 16px; margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    .section-header span {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted2);
    }
    .section-header::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(168,85,247,0.3), transparent);
    }

    /* ── CARDS ── */
    .cards { display: flex; flex-direction: column; gap: 12px; }

    @keyframes borderGlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--glass);
      border: none;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      transition: background 0.3s, transform 0.25s, box-shadow 0.3s;
    }

    /* animated gradient border via pseudo element */
    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(270deg, #7c3aed, #c084fc, #ec4899, #818cf8, #7c3aed);
      background-size: 400% 400%;
      animation: borderGlow 4s ease infinite;
      z-index: -1;
    }

    /* inner fill to fake border */
    .card::after {
      content: '';
      position: absolute;
      inset: 1.5px;
      border-radius: 23px;
      background: rgba(40, 5, 80, 0.85);
      z-index: -1;
    }

    .card:nth-child(1) { animation-delay: 0.55s; }
    .card:nth-child(2) { animation-delay: 0.65s; }
    .card:nth-child(3) { animation-delay: 0.75s; }

    .card:hover {
      background: var(--glass-hover);
      border-color: rgba(168,85,247,0.5);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(124,58,237,0.3), 0 0 0 1px rgba(168,85,247,0.2);
    }

    /* TOP ROW */
    .card-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* APP LOGO */
    .app-logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(168,85,247,0.3);
      background: rgba(120,50,200,0.2);
      box-shadow: 0 0 16px rgba(168,85,247,0.2);
    }

    .card-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      border: 1px solid rgba(168,85,247,0.3);
      background: linear-gradient(135deg,rgba(124,58,237,0.5),rgba(192,132,252,0.2));
      box-shadow: 0 0 20px rgba(124,58,237,0.4);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-name {
      font-size: 18px; font-weight: 700;
      color: #fff; letter-spacing: -0.3px;
      text-shadow: 0 0 20px rgba(168,85,247,0.4);
    }

    .card-desc {
      font-size: 14px; font-weight: 300;
      color: var(--muted); line-height: 1.65;
      margin-bottom: 14px;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid rgba(168,85,247,0.25);
      color: rgba(192,132,252,0.7);
      background: rgba(124,58,237,0.1);
    }

    /* DOWNLOAD BUTTON */
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      border: none; cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124,58,237,0.6), 0 0 0 1px rgba(168,85,247,0.3);
    }
    .dl-btn:hover { transform: scale(0.96); opacity: 0.9; }
    .dl-btn svg   { width: 15px; height: 15px; }

    /* DOWNLOAD BUTTON GROUP (for cards with multiple platform links) */
    .dl-btn-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      flex-shrink: 0;
    }

    /* iOS SECONDARY BUTTON */
    .ios-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: transform 0.2s, opacity 0.2s, background 0.2s;
      background: rgba(168,85,247,0.1);
      border: 1px solid rgba(168,85,247,0.35);
      color: rgba(192,132,252,0.9);
    }
    .ios-btn:hover { transform: scale(0.96); background: rgba(168,85,247,0.2); }
    .ios-btn svg   { width: 12px; height: 12px; }

    /*
